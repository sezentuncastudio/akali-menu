<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Akali — Gölet</title>
<style>
  :root{
    --red:#9B1B1E;
    --ink:#0a0a0a;
    --grey:#6b6b6b;
    --light:#9a9a9a;
    --hair:#ececec;
    --green:#3aaa35;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:#fff;color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 24px;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);
    backdrop-filter:blur(10px);
  }
  .topbar-inner{
    max-width:560px;margin:0 auto;padding:14px 24px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .lang{display:flex;margin-left:auto;}
  .lang button{
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;
    background:#fff;color:var(--ink);border:1px solid var(--ink);
    padding:6px 13px;cursor:pointer;
  }
  .lang button + button{border-left:0;}
  .lang button.on{background:var(--ink);color:#fff;}
  .nav{
    display:flex;gap:22px;max-width:560px;margin:0 auto;padding:6px 24px 14px;
    overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hair);
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav a{
    flex-shrink:0;font-size:11px;font-weight:700;letter-spacing:.18em;
    text-decoration:none;color:var(--ink);text-transform:uppercase;padding:2px 0;
  }

  /* ---------- hero signature: large, just slightly out of frame ---------- */
  .hero{max-width:560px;margin:0 auto;padding-top:52px;overflow:visible;}
  .hero img{width:107%;max-width:none;margin-left:-3.5%;display:block;}

  /* ---------- section titles: full-bleed, fitted by JS ---------- */
  h1.sec{
    font-weight:800;letter-spacing:-.045em;line-height:.88;
    white-space:nowrap;width:100%;
    padding-top:130px;margin-bottom:64px;
  }
  section:first-child h1.sec{padding-top:70px;}

  h2.sub{
    font-size:17px;font-weight:700;text-transform:uppercase;
    white-space:nowrap;width:100%;margin:110px 0 54px;
  }
  h2.sub .amp{color:var(--green);}

  /* ---------- items ---------- */
  .item{cursor:pointer;margin-bottom:44px;}
  .row1{display:flex;align-items:baseline;gap:14px;}
  .n-big{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .n-name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3;}
  .vol{font-weight:400;color:var(--grey);font-size:12px;margin-left:6px;}
  .price{font-weight:700;font-size:16px;white-space:nowrap;margin-left:auto;}
  .plus{
    width:13px;height:13px;position:relative;flex-shrink:0;
    transition:transform .3s;
  }
  .row2{display:flex;align-items:flex-start;gap:14px;margin-top:12px;}
  .row2 .col{flex:1;min-width:0;}
  .row2 .desc{margin-top:0;}
  .row2 .plus{margin-left:auto;margin-top:4px;}
  .item.slim .row2{margin-top:8px;}
  .plus::before,.plus::after{
    content:"";position:absolute;background:var(--ink);
  }
  .plus::before{left:6px;top:0;width:1.5px;height:13px;}
  .plus::after{left:0;top:6px;width:13px;height:1.5px;}
  .item.open .plus{transform:rotate(45deg);}
  .desc{
    font-size:13px;line-height:1.6;color:var(--grey);
    margin-top:12px;max-width:88%;
  }
  .detail{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .detail-inner{padding-top:12px;}
  .col.only .detail-inner{padding-top:2px;}
  .kcal{font-size:13px;font-weight:700;margin-bottom:12px;}
  .kcal span{font-weight:400;font-style:italic;color:var(--grey);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--ink);padding:6px 11px;color:var(--ink);
  }
  .chip.none{border-color:var(--hair);color:var(--light);font-weight:400;letter-spacing:.04em;text-transform:none;}

  /* drinks: tighter single-line rhythm */
  .item.slim{margin-bottom:0;padding:19px 0;border-bottom:1px solid var(--hair);}
  .item.slim:last-child{border-bottom:0;}
  .item.slim .n-name{font-weight:500;font-size:15px;}

  /* ---------- closing signature, cropped ---------- */
  .sig-end{height:52vw;max-height:320px;overflow:hidden;position:relative;margin-top:60px;}
  .sig-end img{
    position:absolute;width:116%;max-width:none;
    left:-6%;top:0;
  }

  /* ---------- footer ---------- */
  footer{padding-top:70px;}
  .brands{display:flex;align-items:center;gap:30px;margin-bottom:54px;}
  .brands img.heinz{height:44px;}
  .brands img.pepsi{height:46px;}
  .f-title{font-weight:700;font-size:15px;margin-bottom:6px;}
  .f-line{font-size:13px;color:var(--grey);line-height:1.7;}
  a.mail{color:var(--ink);}
  .f-block{margin-top:44px;display:flex;gap:22px;}
  .f-block .lbl{
    flex-shrink:0;width:86px;
    font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;line-height:1.7;
  }
  .f-block p{font-size:11px;color:var(--grey);line-height:1.7;}
  .yerli{height:40px;display:block;margin-top:44px;}
  .f-note{font-size:10px;color:var(--light);margin-top:20px;line-height:1.6;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="lang">
      <button id="btn-tr" class="on" onclick="setLang('tr')">TR</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <nav class="nav">
    <a href="#burger">Burger</a>
    <a href="#sauces" data-t="nav_sauces">Soslar</a>
    <a href="#drinks" data-t="nav_drinks">İçecekler</a>
  </nav>
</div>

let lang = "tr";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function render(){
  const root = document.getElementById("menu");
  let h = "";
  MENU.forEach(sec=>{
    h += `<section id="${sec.id}"><h1 class="sec" data-fit>${esc(sec.title[lang])}</h1>`;
    sec.groups.forEach(g=>{
      if(g.sub){
        const s = g.sub[lang];
        const inner = s.startsWith("&")
          ? `<span class="amp">&amp;</span>` + esc(s.slice(1))
          : esc(s);
        h += `<h2 class="sub" data-spread>${inner}</h2>`;
      }
      g.items.forEach(it=>{
        const big = g.style==="big";
        const slim = g.style==="slim";
        const name = big
          ? `<div class="n-big">${it.num}</div>`
          : `<div class="n-name">${esc(it.n[lang])}${it.vol?`<span class="vol">${it.vol}</span>`:""}</div>`;
        let chips;
        if(it.a === "all") chips = `<span class="chip none">${T.alg_all[lang]}</span>`;
        else if(!it.a || it.a.length===0) chips = "";
        else chips = it.a.map(k=>`<span class="chip">${ALG[k][lang]}</span>`).join("");
        const kcal = it.k===null ? "" : `<div class="kcal">${it.k} <span>${T.kcal_lbl[lang]}</span></div>`;
        const detail = `<div class="detail"><div class="detail-inner">${kcal}${chips?`<div class="chips">${chips}</div>`:""}</div></div>`;
        const body = `<div class="row2"><div class="col${it.d?"":" only"}">${it.d?`<div class="desc">${esc(it.d[lang])}</div>`:""}${detail}</div><div class="plus"></div></div>`;
        h += `
        <div class="item${slim?" slim":""}" onclick="toggle(this)">
          <div class="row1">${name}<div class="price">${it.p}₺</div></div>
          ${body}
        </div>`;
      });
    });
    h += `</section>`;
  });
  root.innerHTML = h;

  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if(T[k]) el.textContent = T[k][lang];
  });
  document.documentElement.lang = lang;
  fitAll();
}

/* scale section titles so they span the full column width,
   from the left content edge to the right edge (where the + sits) */
function fitAll(){
  document.querySelectorAll("[data-fit]").forEach(el=>{
    const target = el.parentElement.clientWidth;
    el.style.fontSize = "100px";
    el.style.width = "max-content";
    const w = el.getBoundingClientRect().width;
    el.style.width = "100%";
    if(w > 0) el.style.fontSize = (100 * target / w) + "px";
  });
  /* spread subheads edge-to-edge with letter-spacing (like the print menu) */
  document.querySelectorAll("[data-spread]").forEach(el=>{
    el.style.letterSpacing = "0px";
    const len = el.textContent.replace(/\s/g,"").length + el.textContent.split(/\s+/).length - 1;
    if(len < 2) return;
    const target = el.parentElement.clientWidth;
    el.style.width = "max-content";
    const textW = el.getBoundingClientRect().width;
    el.style.width = "100%";
    const extra = (target - textW) / (len - 1);
    if(extra > 0) el.style.letterSpacing = extra + "px";
  });
}

function toggle(el){
  const d = el.querySelector(".detail");
  const open = el.classList.toggle("open");
  d.style.maxHeight = open ? d.scrollHeight + "px" : "0";
}

function setLang(l){
  lang = l;
  document.getElementById("btn-tr").classList.toggle("on", l==="tr");
  document.getElementById("btn-en").classList.toggle("on", l==="en");
  render();
}

window.addEventListener("resize", fitAll);
window.addEventListener("load", fitAll);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
render();
</script>
